<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres · CoachBoot Enterprise</title>
  <meta name="description" content="Plateforme de performance football CoachBoot Enterprise">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232C8F5E%22/><text x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22%2306170F%22 font-family=%22Arial%22 font-weight=%22bold%22>CB</text></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <!-- AOS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.1/aos.css">
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.13.11/css/jquery.dataTables.min.css">

  <!-- CoachBoot design system -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="settings">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div class="app-main">
      <div id="app-header"></div>
      <main class="content">
        <div class="page-head">
          <div>
            <span class="eyebrow">Compte</span>
            <h1>Paramètres</h1>
            <p>Préférences de l'application et de la plateforme</p>
          </div>
          
        </div>
        
    <div class="tabs" data-tabs-wrap><button data-tab="general" class="active">Général</button><button data-tab="notifs" class="">Notifications</button><button data-tab="security" class="">Sécurité</button></div>
    <div data-tab-panel="general" class="card"><div class="card__body">
      <div class="grid grid-2">
        <div class="field"><label>Langue</label><select><option>Français</option><option>English</option><option>Español</option></select></div>
        <div class="field"><label>Fuseau horaire</label><select><option>(GMT+1) Paris</option><option>(GMT+0) Londres</option><option>(GMT-4) Port-au-Prince</option></select></div>
      </div>
      <div class="field"><label>Mode d'affichage</label>
        <div style="display:flex;gap:12px;align-items:center;">
          <span>Clair</span><button class="theme-toggle" id="themeToggleSettings"><span class="knob"><i class="fa-solid fa-moon"></i></span></button><span>Sombre</span>
        </div>
      </div>
      <button class="btn btn-primary">Enregistrer les modifications</button>
    </div></div>
    <div data-tab-panel="notifs" class="card" style="display:none;"><div class="card__body">
      
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:13.5px;">Alertes de blessure</span><button class="theme-toggle" style="transform:scale(.9)"><span class="knob"><i class="fa-solid fa-check" style="font-size:8px;"></i></span></button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:13.5px;">Nouveaux rapports de scouting</span><button class="theme-toggle" style="transform:scale(.9)"><span class="knob"><i class="fa-solid fa-check" style="font-size:8px;"></i></span></button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:13.5px;">Rappels de match</span><button class="theme-toggle" style="transform:scale(.9)"><span class="knob"><i class="fa-solid fa-check" style="font-size:8px;"></i></span></button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:13.5px;">Messages du staff</span><button class="theme-toggle" style="transform:scale(.9)"><span class="knob"><i class="fa-solid fa-check" style="font-size:8px;"></i></span></button>
        </div>
    </div></div>
    <div data-tab-panel="security" class="card" style="display:none;"><div class="card__body">
      <div class="field">
    <label>Mot de passe actuel</label>
    <div class="">

      <input type="password" id="currentPasswordInput" placeholder="" value="" autocomplete="current-password">
    </div>

  </div>
      <div class="field">
    <label>Nouveau mot de passe</label>
    <div class="">

      <input type="password" id="newPasswordInput" placeholder="8 caractères minimum" value="" autocomplete="new-password">
    </div>

  </div>
      <button class="btn btn-primary" id="changePasswordBtn">Mettre à jour le mot de passe</button>
    </div></div>
  
      </main>
    </div>
  </div>

  <!-- jQuery + DataTables -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.13.11/js/jquery.dataTables.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <!-- ApexCharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.49.1/apexcharts.min.js"></script>
  <!-- AOS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.1/aos.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.12.0/sweetalert2.all.min.js"></script>

  <!-- CoachBoot shared JS -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/charts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('themeToggleSettings')?.addEventListener('click', () => document.getElementById('themeToggle')?.click());

      document.getElementById('changePasswordBtn')?.addEventListener('click', async () => {
        const current = document.getElementById('currentPasswordInput').value;
        const next = document.getElementById('newPasswordInput').value;
        if (!current || !next) {
          return Swal.fire({ icon: 'warning', title: 'Champs requis', text: 'Renseignez le mot de passe actuel et le nouveau mot de passe.', confirmButtonColor: '#2C8F5E' });
        }
        if (!CB_API.isAuthenticated()) {
          return Swal.fire({ icon: 'warning', title: 'Connexion requise', text: 'Connectez-vous pour changer votre mot de passe.', confirmButtonColor: '#2C8F5E' });
        }
        try {
          await CB_API.changePassword(current, next);
          document.getElementById('currentPasswordInput').value = '';
          document.getElementById('newPasswordInput').value = '';
          await Swal.fire({ icon: 'success', title: 'Mot de passe changé', confirmButtonColor: '#2C8F5E' });
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Erreur', text: err.message, confirmButtonColor: '#2C8F5E' });
        }
      });
    });
  </script>
</body>
</html>
